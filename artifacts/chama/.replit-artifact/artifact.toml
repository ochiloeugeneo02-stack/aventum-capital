kind = "web"
previewPath = "/"
title = "Chama by Aventum"
version = "1.0.0"
id = "artifacts/chama"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18135

[services.development]
run = "pnpm --filter @workspace/chama run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chama", "run", "build" ]
publicDir = "artifacts/chama/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18135"
BASE_PATH = "/"
