openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Chama by Aventum - Digital Rotational Savings Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: organizations
    description: Organization management
  - name: groups
    description: Group management
  - name: contributions
    description: Contribution management
  - name: payouts
    description: Payout management
  - name: dashboard
    description: Dashboard summary data
  - name: admin
    description: Admin operations
  - name: rbac
    description: Role-based access control — departments, unlock requests, role change requests, finance approvals
  - name: security
    description: Security questions setup and verification

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # USERS
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ORGANIZATIONS
  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create a new organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationBody"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /organizations/{orgId}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get organization details
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetails"

  # GROUPS
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List groups for current user
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupBody"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{groupId}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get group details with members
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetails"
    put:
      operationId: updateGroup
      tags: [groups]
      summary: Update group settings
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupBody"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{groupId}/invite:
    post:
      operationId: inviteMember
      tags: [groups]
      summary: Invite a member to a group
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberBody"
      responses:
        "200":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /groups/{groupId}/members:
    get:
      operationId: getGroupMembers
      tags: [groups]
      summary: Get members of a group
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMember"

  /groups/{groupId}/pause:
    post:
      operationId: pauseGroup
      tags: [groups]
      summary: Pause a group
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{groupId}/resume:
    post:
      operationId: resumeGroup
      tags: [groups]
      summary: Resume a paused group
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  # CONTRIBUTIONS
  /contributions:
    get:
      operationId: listContributions
      tags: [contributions]
      summary: List contributions for current user
      parameters:
        - in: query
          name: groupId
          schema:
            type: integer
        - in: query
          name: cycleId
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
            enum: [paid, pending, failed]
      responses:
        "200":
          description: List of contributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contribution"

  /contributions/pay:
    post:
      operationId: payContribution
      tags: [contributions]
      summary: Submit a contribution payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayContributionBody"
      responses:
        "201":
          description: Contribution recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contribution"
        "400":
          description: Already paid or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contributions/all:
    get:
      operationId: listAllContributions
      tags: [contributions]
      summary: List all contributions (admin)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: All contributions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionListResponse"

  # PAYOUTS
  /payouts:
    get:
      operationId: listPayouts
      tags: [payouts]
      summary: List payouts for current user
      parameters:
        - in: query
          name: groupId
          schema:
            type: integer
      responses:
        "200":
          description: List of payouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payout"

  /payouts/all:
    get:
      operationId: listAllPayouts
      tags: [payouts]
      summary: List all payouts (admin)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: All payouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutListResponse"

  /payouts/{payoutId}/complete:
    post:
      operationId: completePayout
      tags: [payouts]
      summary: Mark a payout as completed (admin)
      parameters:
        - in: path
          name: payoutId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payout completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"

  # DASHBOARD
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get member dashboard summary data
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/admin-stats:
    get:
      operationId: getAdminStats
      tags: [dashboard]
      summary: Get admin-level platform statistics
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # AUDIT LOGS
  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [admin]
      summary: List audit logs (admin)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

  /admin/payout-trigger:
    post:
      operationId: triggerPayout
      tags: [admin]
      summary: Manually trigger payout for a group cycle (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerPayoutBody"
      responses:
        "200":
          description: Payout triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"

  # RBAC — DEPARTMENTS
  /admin/departments:
    get:
      operationId: listDepartments
      tags: [rbac]
      summary: List all departments
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [rbac]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartmentBody"
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /admin/departments/{departmentId}:
    put:
      operationId: updateDepartment
      tags: [rbac]
      summary: Update a department (role change propagates to all members)
      parameters:
        - in: path
          name: departmentId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDepartmentBody"
      responses:
        "200":
          description: Department updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
    delete:
      operationId: deleteDepartment
      tags: [rbac]
      summary: Delete a department
      parameters:
        - in: path
          name: departmentId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /admin/departments/{departmentId}/staff:
    get:
      operationId: listDepartmentStaff
      tags: [rbac]
      summary: List staff assigned to a department
      parameters:
        - in: path
          name: departmentId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/departments/{departmentId}/assign:
    post:
      operationId: assignUserToDepartment
      tags: [rbac]
      summary: Assign a user to a department (copies department role to user)
      parameters:
        - in: path
          name: departmentId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
              required: [userId]
      responses:
        "200":
          description: User assigned

  # RBAC — ACCOUNT UNLOCK
  /admin/unlock-requests:
    post:
      operationId: createUnlockRequest
      tags: [rbac]
      summary: Submit an account unlock request (user self-service after lockout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUnlockRequestBody"
      responses:
        "201":
          description: Unlock request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockRequest"
    get:
      operationId: listUnlockRequests
      tags: [rbac]
      summary: List unlock requests (admin)
      responses:
        "200":
          description: List of unlock requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnlockRequest"

  /admin/unlock-requests/{requestId}/approve:
    post:
      operationId: approveUnlockRequest
      tags: [rbac]
      summary: Approve an account unlock request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account unlocked

  /admin/unlock-requests/{requestId}/deny:
    post:
      operationId: denyUnlockRequest
      tags: [rbac]
      summary: Deny an account unlock request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request denied

  # RBAC — ROLE CHANGE REQUESTS
  /admin/role-requests:
    post:
      operationId: createRoleRequest
      tags: [rbac]
      summary: Submit a role change request for a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequestBody"
      responses:
        "201":
          description: Role change request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleChangeRequest"
    get:
      operationId: listRoleRequests
      tags: [rbac]
      summary: List role change requests (admin)
      responses:
        "200":
          description: List of role change requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleChangeRequest"

  /admin/role-requests/{requestId}/approve:
    post:
      operationId: approveRoleRequest
      tags: [rbac]
      summary: Approve a role change request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role change approved

  /admin/role-requests/{requestId}/deny:
    post:
      operationId: denyRoleRequest
      tags: [rbac]
      summary: Deny a role change request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role change denied

  # RBAC — FINANCE APPROVALS (dual-control)
  /admin/finance-approvals:
    post:
      operationId: createFinanceApproval
      tags: [rbac]
      summary: Submit a finance action for CFO dual-control approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinanceApprovalBody"
      responses:
        "201":
          description: Finance approval request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceApproval"
    get:
      operationId: listFinanceApprovals
      tags: [rbac]
      summary: List finance approval requests
      responses:
        "200":
          description: List of finance approval requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceApproval"

  /admin/finance-approvals/{requestId}/approve:
    post:
      operationId: approveFinanceRequest
      tags: [rbac]
      summary: CFO approves a finance action (dual-control)
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Finance action approved

  /admin/finance-approvals/{requestId}/deny:
    post:
      operationId: denyFinanceRequest
      tags: [rbac]
      summary: CFO denies a finance action (dual-control)
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Finance action denied

  # SECURITY — QUESTIONS
  /auth/security-questions/setup:
    post:
      operationId: setupSecurityQuestions
      tags: [security]
      summary: Set up 3 security questions (required for staff portal access)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityQuestionsSetupBody"
      responses:
        "200":
          description: Security questions saved
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/security-questions/verify:
    post:
      operationId: verifySecurityQuestions
      tags: [security]
      summary: Verify security question answers (used during account unlock flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityQuestionsVerifyBody"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                required: [verified]
        "400":
          description: Validation error

  /auth/security-questions/{email}:
    get:
      operationId: getSecurityQuestions
      tags: [security]
      summary: Fetch security question prompts for a locked account (requires recovery challenge)
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
          description: Email address of the locked account
        - in: query
          name: challenge
          required: true
          schema:
            type: string
          description: Short-lived recovery challenge token issued by the login lockout response
      responses:
        "200":
          description: Security questions and a signed recovery token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityQuestionsResponse"
        "400":
          description: Account not locked or questions not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid or missing recovery challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # RBAC — STAFF USER MANAGEMENT
  /admin/staff-users:
    post:
      operationId: inviteStaffUser
      tags: [rbac]
      summary: Invite a new staff member (creates account + sends set-password email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteStaffBody"
      responses:
        "201":
          description: Staff user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/staff-users/{userId}/resend-invite:
    post:
      operationId: resendStaffInvite
      tags: [rbac]
      summary: Resend invitation email for a staff member whose invite link has expired
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invite resent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
                  - message
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User does not require a password reset or their invite is still valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/staff-users/{userId}/role:
    put:
      operationId: updateUserRole
      tags: [rbac]
      summary: Directly update a user's role and/or isFinanceAdmin flag (super_admin/CEO only)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleBody"
      responses:
        "200":
          description: User role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    # AUTH
    RegisterBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [member]
          default: member
          description: "Always assigned as 'member' server-side. Privileged roles require admin approval."
        username:
          type: string
          nullable: true
        motivation:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        emailMarketing:
          type: boolean
          nullable: true
      required:
        - name
        - email
        - password

    LoginBody:
      type: object
      properties:
        email:
          type: string
          description: Email address or username
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required:
        - user

    # USER
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [member, group_admin, org_admin, super_admin, ceo, cto_admin, it_support, finance, marketing, relationship_manager]
        organizationId:
          type: integer
          nullable: true
        departmentId:
          type: integer
          nullable: true
        isFinanceAdmin:
          type: boolean
          nullable: true
        twoFactorEnabled:
          type: boolean
        phoneNumber:
          type: string
          nullable: true
        isActive:
          type: boolean
        requiresPasswordReset:
          type: boolean
        passwordResetTokenExpiry:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - isActive
        - createdAt

    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - users
        - total
        - page
        - limit

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
        username:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        emailMarketing:
          type: boolean
          nullable: true
        notificationEmail:
          type: boolean
        notificationSms:
          type: boolean
        avatar:
          type: string
          nullable: true

    # ORGANIZATION
    Organization:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        adminId:
          type: integer
        totalMembers:
          type: integer
        totalGroups:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - adminId
        - totalMembers
        - totalGroups
        - createdAt

    OrganizationDetails:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        adminId:
          type: integer
        totalMembers:
          type: integer
        totalGroups:
          type: integer
        totalContributed:
          type: number
        totalPaidOut:
          type: number
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - adminId
        - totalMembers
        - totalGroups
        - totalContributed
        - totalPaidOut
        - groups
        - createdAt

    CreateOrganizationBody:
      type: object
      properties:
        name:
          type: string
      required:
        - name

    # GROUP
    Group:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        adminId:
          type: integer
        organizationId:
          type: integer
          nullable: true
        contributionAmount:
          type: number
        currency:
          type: string
          default: USD
        schedule:
          type: string
          enum: [weekly, bi-weekly, monthly]
        maxMembers:
          type: integer
        currentCycle:
          type: integer
        currentRotationIndex:
          type: integer
        status:
          type: string
          enum: [active, paused, completed]
        totalMembers:
          type: integer
        paidCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - adminId
        - contributionAmount
        - schedule
        - maxMembers
        - currentCycle
        - currentRotationIndex
        - status
        - totalMembers
        - paidCount
        - createdAt

    GroupDetails:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        adminId:
          type: integer
        organizationId:
          type: integer
          nullable: true
        contributionAmount:
          type: number
        schedule:
          type: string
        maxMembers:
          type: integer
        currentCycle:
          type: integer
        currentRotationIndex:
          type: integer
        status:
          type: string
        totalMembers:
          type: integer
        paidCount:
          type: integer
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
        currentRecipient:
          $ref: "#/components/schemas/User"
          nullable: true
        nextDueDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - adminId
        - contributionAmount
        - schedule
        - maxMembers
        - currentCycle
        - currentRotationIndex
        - status
        - totalMembers
        - paidCount
        - members
        - createdAt

    GroupMember:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        groupId:
          type: integer
        rotationOrder:
          type: integer
        hasReceivedPayout:
          type: boolean
        user:
          $ref: "#/components/schemas/User"
        contributionStatus:
          type: string
          enum: [paid, pending, none]
          description: Status in current cycle
        joinedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - groupId
        - rotationOrder
        - hasReceivedPayout
        - user
        - contributionStatus
        - joinedAt

    CreateGroupBody:
      type: object
      properties:
        name:
          type: string
        contributionAmount:
          type: number
        schedule:
          type: string
          enum: [weekly, bi-weekly, monthly]
          default: bi-weekly
        maxMembers:
          type: integer
          default: 5
        organizationId:
          type: integer
          nullable: true
        currency:
          type: string
          nullable: true
      required:
        - name
        - contributionAmount

    UpdateGroupBody:
      type: object
      properties:
        name:
          type: string
        contributionAmount:
          type: number
        schedule:
          type: string
          enum: [weekly, bi-weekly, monthly]

    InviteMemberBody:
      type: object
      properties:
        email:
          type: string
          format: email
        rotationOrder:
          type: integer
          nullable: true
      required:
        - email

    # CONTRIBUTION
    Contribution:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        groupId:
          type: integer
        cycleId:
          type: integer
        amount:
          type: number
        status:
          type: string
          enum: [paid, pending, failed]
        paidAt:
          type: string
          format: date-time
          nullable: true
        user:
          $ref: "#/components/schemas/User"
          nullable: true
        group:
          $ref: "#/components/schemas/Group"
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - groupId
        - cycleId
        - amount
        - status
        - createdAt

    PayContributionBody:
      type: object
      properties:
        groupId:
          type: integer
        cycleId:
          type: integer
      required:
        - groupId
        - cycleId

    ContributionListResponse:
      type: object
      properties:
        contributions:
          type: array
          items:
            $ref: "#/components/schemas/Contribution"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - contributions
        - total
        - page
        - limit

    # PAYOUT
    Payout:
      type: object
      properties:
        id:
          type: integer
        groupId:
          type: integer
        cycleId:
          type: integer
        recipientId:
          type: integer
        amount:
          type: number
        status:
          type: string
          enum: [pending, paid, failed]
        paidAt:
          type: string
          format: date-time
          nullable: true
        recipient:
          $ref: "#/components/schemas/User"
          nullable: true
        group:
          $ref: "#/components/schemas/Group"
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - groupId
        - cycleId
        - recipientId
        - amount
        - status
        - createdAt

    PayoutListResponse:
      type: object
      properties:
        payouts:
          type: array
          items:
            $ref: "#/components/schemas/Payout"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - payouts
        - total
        - page
        - limit

    TriggerPayoutBody:
      type: object
      properties:
        groupId:
          type: integer
        cycleId:
          type: integer
      required:
        - groupId
        - cycleId

    # DASHBOARD
    DashboardSummary:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        currentGroup:
          $ref: "#/components/schemas/Group"
          nullable: true
        contributionStatus:
          type: string
          enum: [paid, pending, none]
        totalContributed:
          type: number
        nextDueDate:
          type: string
          format: date-time
          nullable: true
        upcomingRecipient:
          $ref: "#/components/schemas/User"
          nullable: true
        cycleId:
          type: integer
          nullable: true
        recentPayouts:
          type: array
          items:
            $ref: "#/components/schemas/Payout"
        recentContributions:
          type: array
          items:
            $ref: "#/components/schemas/Contribution"
      required:
        - user
        - contributionStatus
        - totalContributed
        - recentPayouts
        - recentContributions

    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalGroups:
          type: integer
        totalOrganizations:
          type: integer
        activeGroups:
          type: integer
        totalContributed:
          type: number
        totalPaidOut:
          type: number
        pendingPayouts:
          type: integer
        failedTransactions:
          type: integer
      required:
        - totalUsers
        - totalGroups
        - totalOrganizations
        - activeGroups
        - totalContributed
        - totalPaidOut
        - pendingPayouts
        - failedTransactions

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [contribution, payout, member_joined, group_created, group_paused]
        description:
          type: string
        userId:
          type: integer
          nullable: true
        groupId:
          type: integer
          nullable: true
        amount:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - description
        - createdAt

    AuditLog:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
        performedBy:
          type: integer
        targetType:
          type: string
        targetId:
          type: integer
          nullable: true
        details:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
          nullable: true
      required:
        - id
        - action
        - performedBy
        - targetType
        - createdAt

    AuditLogListResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - logs
        - total
        - page
        - limit

    # RBAC SCHEMAS
    Department:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          enum: [member, group_admin, org_admin, super_admin, ceo, cto_admin, it_support, finance, marketing, relationship_manager]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - role
        - createdAt

    CreateDepartmentBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          enum: [member, group_admin, org_admin, super_admin, ceo, cto_admin, it_support, finance, marketing, relationship_manager]
      required:
        - name
        - role

    UpdateDepartmentBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          enum: [member, group_admin, org_admin, super_admin, ceo, cto_admin, it_support, finance, marketing, relationship_manager]

    UnlockRequest:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        reason:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, denied]
        reviewedBy:
          type: integer
          nullable: true
        reviewNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        user:
          $ref: "#/components/schemas/User"
          nullable: true
        reviewer:
          $ref: "#/components/schemas/User"
          nullable: true
      required:
        - id
        - userId
        - status
        - createdAt

    CreateUnlockRequestBody:
      type: object
      properties:
        userId:
          type: integer
        reason:
          type: string
      required:
        - userId

    RoleChangeRequest:
      type: object
      properties:
        id:
          type: integer
        requestedBy:
          type: integer
        targetUserId:
          type: integer
        requestedRole:
          type: string
          enum: [member, group_admin, org_admin, super_admin, ceo, cto_admin, it_support, finance, marketing, relationship_manager]
        reason:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, denied]
        reviewedBy:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        requester:
          type: object
          nullable: true
          properties:
            name:
              type: string
            email:
              type: string
        targetUser:
          type: object
          nullable: true
          properties:
            name:
              type: string
            email:
              type: string
      required:
        - id
        - requestedBy
        - targetUserId
        - requestedRole
        - status
        - createdAt

    CreateRoleRequestBody:
      type: object
      properties:
        targetUserId:
          type: integer
        requestedRole:
          type: string
          enum: [member, group_admin, org_admin, super_admin, ceo, cto_admin, it_support, finance, marketing, relationship_manager]
        reason:
          type: string
      required:
        - targetUserId
        - requestedRole

    FinanceApproval:
      type: object
      properties:
        id:
          type: integer
        requestedBy:
          type: integer
        actionType:
          type: string
        actionPayload:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, denied]
        reviewedBy:
          type: integer
          nullable: true
        reviewNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        requester:
          type: object
          nullable: true
          properties:
            name:
              type: string
            email:
              type: string
        reviewer:
          type: object
          nullable: true
          properties:
            name:
              type: string
            email:
              type: string
      required:
        - id
        - requestedBy
        - actionType
        - status
        - createdAt

    CreateFinanceApprovalBody:
      type: object
      properties:
        actionType:
          type: string
          minLength: 1
          maxLength: 100
        actionPayload:
          type: object
      required:
        - actionType
        - actionPayload

    # SECURITY SCHEMAS
    SecurityQuestionsSetupBody:
      type: object
      properties:
        questions:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            properties:
              questionIndex:
                type: integer
                minimum: 0
                maximum: 11
                description: Catalog slot index (0–11) identifying the chosen question
              questionText:
                type: string
                minLength: 5
              answer:
                type: string
                minLength: 2
                maxLength: 200
            required:
              - questionIndex
              - questionText
              - answer
      required:
        - questions

    SecurityQuestionsVerifyBody:
      type: object
      properties:
        recoveryToken:
          type: string
          minLength: 1
          description: Short-lived signed token issued by GET /auth/security-questions/:email
        answers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            properties:
              questionIndex:
                type: integer
                minimum: 0
                maximum: 11
              answer:
                type: string
                minLength: 1
                maxLength: 200
            required:
              - questionIndex
              - answer
      required:
        - recoveryToken
        - answers

    UpdateUserRoleBody:
      type: object
      properties:
        role:
          type: string
          enum: [member, group_admin, org_admin, super_admin, ceo, cto_admin, it_support, finance, marketing, relationship_manager]
        isFinanceAdmin:
          type: boolean
        departmentId:
          type: integer
          nullable: true

    InviteStaffBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ceo, cto_admin, it_support, finance, marketing, relationship_manager, super_admin]
        departmentId:
          type: integer
          nullable: true
      required:
        - name
        - email
        - role

    SecurityQuestionsResponse:
      type: object
      properties:
        questions:
          type: array
          items:
            type: object
            properties:
              questionIndex:
                type: integer
              questionText:
                type: string
            required:
              - questionIndex
              - questionText
        recoveryToken:
          type: string
      required:
        - questions
        - recoveryToken
